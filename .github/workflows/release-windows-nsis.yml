name: Release Windows NSIS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-nsis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CourDL NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build courdl-engine sidecar
        working-directory: engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pack]"
          python -m PyInstaller --noconfirm --clean courdl-engine.spec
          New-Item -ItemType Directory -Force -Path ../src-tauri/binaries | Out-Null
          Copy-Item dist/courdl-engine.exe ../src-tauri/binaries/courdl-engine-x86_64-pc-windows-msvc.exe
          Get-Item ../src-tauri/binaries/courdl-engine-x86_64-pc-windows-msvc.exe

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: CourDL-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Release (manual dispatch)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ format('v0.1.0-test-{0}', github.run_number) }}
          name: CourDL Windows test ${{ github.run_number }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
