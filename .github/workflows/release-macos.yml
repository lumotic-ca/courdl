name: Release macOS DMG

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build (tag, branch, or SHA)
        required: true
        default: v0.1.3
      release_tag:
        description: Existing GitHub release tag to attach the DMG to
        required: true
        default: v0.1.3

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.event.inputs.git_ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CourDL macOS DMG
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build courdl-engine sidecar
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pack]"
          python -m PyInstaller --noconfirm --clean courdl-engine.spec
          mkdir -p ../src-tauri/binaries
          TRIPLE="$(rustc -vV | awk '/host:/{print $2}')"
          cp dist/courdl-engine "../src-tauri/binaries/courdl-engine-${TRIPLE}"
          chmod +x "../src-tauri/binaries/courdl-engine-${TRIPLE}"
          ls -l "../src-tauri/binaries/courdl-engine-${TRIPLE}"
          file "../src-tauri/binaries/courdl-engine-${TRIPLE}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build DMG
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: npx tauri build --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: CourDL-macos-dmg
          path: |
            target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
