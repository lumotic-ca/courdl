[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "courdl-engine"
version = "0.2.0"
description = "CourDL sidecar: dl_coursera + beautify with JSONL progress"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dl_coursera==1.0.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
pack = ["pyinstaller>=6.3"]

[project.scripts]
courdl-engine = "courdl_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["courdl_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
